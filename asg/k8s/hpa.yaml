# HPA for bookinfo microservices
# Requires metrics-server (installed as EKS addon in tf/metrics-server.tf)
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: productpage
  namespace: bookinfo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: productpage-v1
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
