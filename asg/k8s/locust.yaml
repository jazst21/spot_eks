apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-script
  namespace: bookinfo
data:
  locustfile.py: |
    from locust import HttpUser, task, between

    class BookinfoUser(HttpUser):
        host = "http://productpage:9080"
        weight = 5
        wait_time = between(1, 3)

        @task(5)
        def productpage(self):
            self.client.get("/productpage", allow_redirects=False)

        @task(2)
        def api_reviews(self):
            self.client.get("/api/v1/products/0/reviews", allow_redirects=False)

        @task(2)
        def api_ratings(self):
            self.client.get("/api/v1/products/0/ratings", allow_redirects=False)

    class GoodUser(HttpUser):
        host = "http://myapp-good:8080"
        weight = 3
        wait_time = between(1, 2)

        @task(3)
        def root(self):
            self.client.get("/", name="/good")

        @task(1)
        def slow(self):
            self.client.get("/slow", name="/good/slow")

    class BadUser(HttpUser):
        host = "http://myapp-bad:8080"
        weight = 3
        wait_time = between(1, 2)

        @task(3)
        def root(self):
            self.client.get("/", name="/bad")

        @task(1)
        def slow(self):
            self.client.get("/slow", name="/bad/slow")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: bookinfo
  labels:
    app: locust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      tolerations:
        - key: workload-type
          operator: Equal
          value: "system"
          effect: NoSchedule
      nodeSelector:
        workload-type: system
      containers:
        - name: locust
          image: locustio/locust:2.37.3
          args: ["-f", "/mnt/locust/locustfile.py", "--host", ""]
          ports:
            - containerPort: 8089
          volumeMounts:
            - name: script
              mountPath: /mnt/locust
      volumes:
        - name: script
          configMap:
            name: locust-script
---
apiVersion: v1
kind: Service
metadata:
  name: locust
  namespace: bookinfo
spec:
  selector:
    app: locust
  ports:
    - port: 8089
      targetPort: 8089
